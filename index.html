<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VNET — Movies</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="description" content="Browse and discover movies. Search, filter, and watch trailers." />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo">🎬</span>
      <h1>VNET MOVIES</h1>
    </div>
    <div class="controls">
      <input id="searchInput" type="text" placeholder="Search movies..." aria-label="Search movies" />
      <select id="genreFilter" aria-label="Filter by genre">
        <option value="">All genres</option>
      </select>
      <select id="yearFilter" aria-label="Filter by year">
        <option value="">All years</option>
      </select>
      <select id="sortSelect" aria-label="Sort by">
        <option value="popular">Popular</option>
        <option value="rating_desc">Rating: High → Low</option>
        <option value="rating_asc">Rating: Low → High</option>
        <option value="year_desc">Year: New → Old</option>
        <option value="year_asc">Year: Old → New</option>
        <option value="title_asc">Title: A → Z</option>
        <option value="title_desc">Title: Z → A</option>
      </select>
    </div>
  </header>

  <main>
    <section id="grid" class="grid" aria-live="polite"></section>
    <div id="emptyState" class="empty" hidden>No movies found. Try different search or filters.</div>
  </main>

  <footer class="footer">
    <p>© <span id="yearNow"></span> VNET Movies.</p>
  </footer>

  <!-- Movie modal -->
  <dialog id="movieModal" class="modal">
    <form method="dialog" class="modal-inner">
      <button class="close" aria-label="Close">✕</button>
      <div class="modal-content">
        <img id="modalPoster" alt="" />
        <div class="modal-info">
          <h2 id="modalTitle"></h2>
          <p id="modalMeta"></p>
          <p id="modalOverview"></p>
          <div class="modal-actions">
            <a id="modalTrailer" class="btn" target="_blank" rel="noopener">Watch trailer</a>
            <button id="addToWatchlist" type="button" class="btn secondary">Add to watchlist</button>
          </div>
        </div>
      </div>
    </form>
  </dialog>

  <!-- Watchlist drawer -->
  <aside class="watchlist">
    <div class="watchlist-header">
      <h3>Watchlist</h3>
      <button id="toggleWatchlist" class="btn small">Toggle</button>
    </div>
    <ul id="watchlistItems"></ul>
  </aside>

  <script src="script.js"></script>
</body>
</html>
